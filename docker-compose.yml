services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sched
      POSTGRES_PASSWORD: sched
      POSTGRES_DB: sched
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sched -d sched"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
